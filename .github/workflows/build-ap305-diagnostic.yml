name: Build Aruba AP-305 diagnostic RAM image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget python3-pyelftools zstd patch

      - name: Download fixed OpenWrt release and AP-305 board support
        run: |
          git clone --depth 1 --branch v24.10.7 https://github.com/openwrt/openwrt.git openwrt
          git clone --depth 1 https://github.com/Fr4ctbyte/OpenWRT-Aruba305.git ap305
          cd openwrt
          # The upstream patch has stale context on 24.10.7. Add its three
          # small registrations directly, asserting each expected anchor.
          cp ../ap305/patches/upstream/qcom-ipq4029-ap-305.dts target/linux/ipq40xx/files-6.6/arch/arm/boot/dts/qcom/
          python3 - <<'PY'
          from pathlib import Path
          network = Path('target/linux/ipq40xx/base-files/etc/board.d/02_network')
          text = network.read_text()
          anchor = 'aruba,ap-303|\\\n'
          assert text.count(anchor) == 1, 'AP-303 network registration changed'
          network.write_text(text.replace(anchor, anchor + '\taruba,ap-305|\\\n'))

          upgrade = Path('target/linux/ipq40xx/base-files/lib/upgrade/platform.sh')
          text = upgrade.read_text()
          anchor = 'aruba,ap-303h |\\\n'
          assert text.count(anchor) == 1, 'AP-303H upgrade registration changed'
          upgrade.write_text(text.replace(anchor, anchor + '\taruba,ap-305 |\\\n'))

          generic = Path('target/linux/ipq40xx/image/generic.mk')
          text = generic.read_text()
          assert 'define Device/aruba_glenmorangie' in text
          assert 'define Device/aruba_ap-305' not in text
          generic.write_text(text + '''

          define Device/aruba_ap-305
          \t$(call Device/aruba_glenmorangie)
          \tDEVICE_MODEL := AP-305
          \tDEVICE_PACKAGES := kmod-hwmon-ad7418 ath10k-firmware-qca99x0-ct
          \tDEVICE_DTS_CONFIG := Glenmorangie@1
          endef
          TARGET_DEVICES += aruba_ap-305
          ''')
          PY
          test -f target/linux/ipq40xx/files-6.6/arch/arm/boot/dts/qcom/qcom-ipq4029-ap-305.dts
          git rev-parse HEAD > ../openwrt-commit.txt
          git -C ../ap305 rev-parse HEAD > ../ap305-commit.txt

      - name: Configure target with kernel diagnostic options
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'CONFIG'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_aruba_ap-305=y
          CONFIG_PACKAGE_luci=y
          CONFIG_KERNEL_DEBUG_KERNEL=y
          CONFIG_KERNEL_DEBUG_FS=y
          CONFIG_KERNEL_PRINTK_TIME=y
          CONFIG_KERNEL_MAGIC_SYSRQ=y
          CONFIG_KERNEL_WATCHDOG=y
          CONFIG_KERNEL_GPIO_WATCHDOG=y
          CONFIG
          make defconfig
          grep -q '^CONFIG_TARGET_ipq40xx_generic_DEVICE_aruba_ap-305=y$' .config
          grep -E '^(CONFIG_KERNEL_(DEBUG_KERNEL|DEBUG_FS|PRINTK_TIME|MAGIC_SYSRQ|GPIO_WATCHDOG))=' .config || true

      - name: Compile diagnostic initramfs and sysupgrade image
        working-directory: openwrt
        run: |
          make -j2 V=s
          test -n "$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f -name '*aruba_ap-305-initramfs-uImage.itb' -print -quit)"
          sha256sum bin/targets/ipq40xx/generic/*aruba_ap-305-initramfs-uImage.itb > ../diagnostic-initramfs.sha256
          find bin/targets/ipq40xx/generic -maxdepth 1 -type f -name '*aruba_ap-305*' -print

      - name: Upload images and reproducibility records
        uses: actions/upload-artifact@v4
        with:
          name: aruba-ap305-diagnostic-ramboot
          path: |
            openwrt/bin/targets/ipq40xx/generic/*aruba_ap-305-initramfs-uImage.itb
            openwrt/bin/targets/ipq40xx/generic/*aruba_ap-305-squashfs-sysupgrade.bin
            openwrt/bin/targets/ipq40xx/generic/sha256sums
            diagnostic-initramfs.sha256
            openwrt-commit.txt
            ap305-commit.txt
