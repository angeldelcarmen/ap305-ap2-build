name: Build Aruba AP-305 AP2 watchdog1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget python3-pyelftools zstd patch

      
      - name: Obtain OpenWrt 24.10.7 and AP-305 support
        run: |
          git clone --depth 1 --branch v24.10.7 https://github.com/openwrt/openwrt.git openwrt
          git clone --depth 1 https://github.com/Fr4ctbyte/OpenWRT-Aruba305.git ap305
          cd openwrt
          python3 - <<'PY'
          
for filename in [
    "target/linux/ipq40xx/base-files/etc/board.d/02_network",
    "target/linux/ipq40xx/base-files/lib/upgrade/platform.sh",
]:
    path = Path(filename)
    data = path.read_text()

    if filename.endswith("02_network"):
        anchor = "aruba,ap-365|\\"
        addition = "aruba,ap-305|\\\n\t"
    else:
        anchor = "aruba,ap-365 |\\"
        addition = "aruba,ap-305 |\\\n\t"

    assert anchor in data, f"No existe el ancla en {filename}"

    if "aruba,ap-305" not in data:
        data = data.replace(anchor, addition + anchor, 1)
        path.write_text(data)

          for filename in [
              "target/linux/ipq40xx/base-files/etc/board.d/02_network",
              "target/linux/ipq40xx/base-files/lib/upgrade/platform.sh",
          ]:
              path = Path(filename)
              data = path.read_text()
              if "aruba,ap-305|" not in data:
                  anchor = "aruba,ap-365|"
                  assert anchor in data, f"No existe el ancla en {filename}"
                  data = data.replace(anchor, "aruba,ap-305|\\\n\t" + anchor, 1)
                  path.write_text(data)

          path = Path("target/linux/ipq40xx/image/generic.mk")
          data = path.read_text()
          assert "define Device/aruba_glenmorangie" in data, "Falta plantilla Aruba"
          if "define Device/aruba_ap-305" not in data:
              data += """
          define Device/aruba_ap-305
          \t$(call Device/aruba_glenmorangie)
          \tDEVICE_MODEL := AP-305
          \tDEVICE_PACKAGES := kmod-hwmon-ad7418 ath10k-firmware-qca99x0-ct
          \tDEVICE_DTS_CONFIG := Glenmorangie@1
          endef
          TARGET_DEVICES += aruba_ap-305
          """
              path.write_text(data)

          print("Soporte AP-305 instalado correctamente")
          PY


      - name: Install watchdog1-only procd patch
        run: |
          mkdir -p openwrt/package/system/procd/patches
          cat > openwrt/package/system/procd/patches/999-ap305-watchdog1.patch <<'PATCH'
          --- a/watchdog.c
          +++ b/watchdog.c
          @@ -26,7 +26,7 @@
           #include "procd.h"
           #include "watchdog.h"
          -#define WDT_PATH	"/dev/watchdog"
          +#define WDT_PATH	"/dev/watchdog1"

           static struct uloop_timeout wdt_timeout;
           static int wdt_fd = -1;
          PATCH

      - name: Configure OpenWrt device
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'CONFIG'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_aruba_ap-305=y
          CONFIG_PACKAGE_luci=y
          CONFIG
          make defconfig
          grep -q '^CONFIG_TARGET_ipq40xx_generic_DEVICE_aruba_ap-305=y$' .config

      - name: Compile target
        working-directory: openwrt
        run: |
          make -j2 V=s
          find bin/targets/ipq40xx/generic -maxdepth 1 -type f -name '*aruba_ap-305*' -print
          test -n "$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f -name '*aruba_ap-305-initramfs-uImage.itb' -print -quit)"

      - name: Upload test firmware
        uses: actions/upload-artifact@v4
        with:
          name: aruba-ap305-ap2-watchdog1-test
          path: |
            openwrt/bin/targets/ipq40xx/generic/*aruba_ap-305-initramfs-uImage.itb
            openwrt/bin/targets/ipq40xx/generic/*aruba_ap-305-squashfs-sysupgrade.bin
            openwrt/bin/targets/ipq40xx/generic/sha256sums
